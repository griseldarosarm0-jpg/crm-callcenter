<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración</title>

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="contenido">

    <h1>Configuración</h1>

    <form>

        <input type="text" placeholder="Nombre de la empresa"><br><br>

        <input type="email" placeholder="Correo de la empresa"><br><br>

        <input type="text" placeholder="Teléfono"><br><br>

        <input type="text" placeholder="Dirección"><br><br>

        <select style="width:100%;padding:10px;margin-bottom:15px;">
            <option>Español</option>
            <option>English</option>
        </select>

        <button>Guardar Configuración</button>

    </form>

    <br><br>

    <table border="1" width="100%">
        <tr>
            <th>Configuración</th>
            <th>Valor</th>
        </tr>

        <tr>
            <td>Empresa</td>
            <td>CRM Call Center</td>
        </tr>

        <tr>
            <td>Correo</td>
            <td>info@crm.com</td>
        </tr>

        <tr>
            <td>Teléfono</td>
            <td>3001234567</td>
        </tr>

        <tr>
            <td>Idioma</td>
            <td>Español</td>
        </tr>

    </table>

</div>

</body>
</html>
